name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PACKAGE: calendar
  TEST_USER_LOGIN: user@tinycld.org
  TEST_USER_PW: TestUser1234!
  ADMIN_USER_LOGIN: admin@tinycld.org
  ADMIN_USER_PW: AdminPass1234!

jobs:
  check:
    name: Typecheck & Unit
    runs-on: ubuntu-latest
    # Without an explicit cap a hung job rides GitHub's 6-hour default,
    # blocking the PR and burning a runner the whole time.
    timeout-minutes: 30
    steps:
      # This PR's code, checked out into its member slot. The workspace root is
      # not a committed repo — bootstrap assembles it from scratch around this
      # checkout. `--assemble-only` clones the `tinycld` member (app shell + core
      # + package-scripts) plus this PACKAGE, skipping PACKAGE's slot since it's
      # already present, so CI tests this PR's code.
      - uses: actions/checkout@v5
        with:
          path: ws/${{ env.PACKAGE }}
      - name: Resolve sibling refs
        id: sibling
        run: |
          # Coordinated cross-repo work (e.g. the single-org migration) lives on
          # the SAME branch name in every repo. Assembling siblings from their
          # default branch then typechecks this PR against a core that predates
          # it — the branch's own APIs are simply absent, so every consumer
          # fails with errors that look like the PR's fault.
          #
          # For each sibling, prefer a branch matching this PR's HEAD and fall
          # back to its default branch when there is none (the ordinary
          # single-repo PR, where every sibling should be at its release state).
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          for repo in tinycld; do
            if [ -n "$BRANCH" ] && \
               git ls-remote --exit-code --heads "https://github.com/tinycld/$repo" "$BRANCH" >/dev/null 2>&1; then
              echo "${repo}_ref=@$BRANCH" >> "$GITHUB_OUTPUT"
              echo "$repo -> $BRANCH"
            else
              echo "${repo}_ref=" >> "$GITHUB_OUTPUT"
              echo "$repo -> (default branch)"
            fi
          done
      - name: Assemble workspace (app + core)
        working-directory: ws
        run: |
          TINYCLD_REPO_BASE=https://github.com/tinycld \
            npx @tinycld/bootstrap@latest --assemble-only \
            --with "tinycld${{ steps.sibling.outputs.tinycld_ref }}"
      - uses: actions/setup-node@v5
        with:
          node-version-file: ws/.node-version
      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/.go-version
      - name: Install (workspace root)
        working-directory: ws
        run: corepack enable && pnpm install --no-frozen-lockfile
      - name: Typecheck + unit
        working-directory: ws/${{ env.PACKAGE }}
        run: pnpm exec tinycld-pkg check
      # calendar/server carries the security-critical Go: the subscription
      # fetcher's SSRF defenses (host validation, the DNS-rebinding-resistant
      # pinned dialer, redirect re-validation, the response cap), the
      # calendar_members authz/RLS rules, and the guest lifecycle. A hosted
      # multi-org tenant runs these rules as its whole authorization boundary.
      # `tinycld-pkg check` is biome + tsc + vitest and has no Go runner, so
      # without this step none of it is exercised on CI.
      #
      # go mod download is not optional: in workspace mode the transitive
      # /go.mod hashes live in go.work.sum, not go.sum, and `go test` fails with
      # "missing go.sum entry for go.mod file" without it. The go.work itself
      # was written by the generator during `pnpm install` above.
      - name: Go build
        working-directory: ws/${{ env.PACKAGE }}/server
        run: |
          go mod download
          go build ./...
      # -count=1 defeats the test cache so a green run always reflects this
      # commit's code rather than a cached result keyed on unchanged inputs.
      - name: Go tests
        working-directory: ws/${{ env.PACKAGE }}/server
        run: go test -count=1 ./...

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Without an explicit cap a hung job rides GitHub's 6-hour default,
    # blocking the PR and burning a runner the whole time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: ws/${{ env.PACKAGE }}
      - name: Resolve sibling refs
        id: sibling
        run: |
          # Coordinated cross-repo work (e.g. the single-org migration) lives on
          # the SAME branch name in every repo. Assembling siblings from their
          # default branch then typechecks this PR against a core that predates
          # it — the branch's own APIs are simply absent, so every consumer
          # fails with errors that look like the PR's fault.
          #
          # For each sibling, prefer a branch matching this PR's HEAD and fall
          # back to its default branch when there is none (the ordinary
          # single-repo PR, where every sibling should be at its release state).
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          for repo in tinycld; do
            if [ -n "$BRANCH" ] && \
               git ls-remote --exit-code --heads "https://github.com/tinycld/$repo" "$BRANCH" >/dev/null 2>&1; then
              echo "${repo}_ref=@$BRANCH" >> "$GITHUB_OUTPUT"
              echo "$repo -> $BRANCH"
            else
              echo "${repo}_ref=" >> "$GITHUB_OUTPUT"
              echo "$repo -> (default branch)"
            fi
          done
      - name: Assemble workspace (app + core)
        working-directory: ws
        run: |
          TINYCLD_REPO_BASE=https://github.com/tinycld \
            npx @tinycld/bootstrap@latest --assemble-only \
            --with "tinycld${{ steps.sibling.outputs.tinycld_ref }}"
      - uses: actions/setup-node@v5
        with:
          node-version-file: ws/.node-version
      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/.go-version
      - name: Install (workspace root)
        working-directory: ws
        run: corepack enable && pnpm install --no-frozen-lockfile
      # Installs watchman so Metro's file watcher doesn't fall back to
      # polling — see tinycld/app#21 for the trace evidence and the
      # blank-page-after-reload flake it fixed.
      - name: Configure test env
        uses: ./ws/tinycld/.github/actions/configure-test-env
      - name: Install Playwright browsers
        working-directory: ws/tinycld
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        working-directory: ws/${{ env.PACKAGE }}
        run: pnpm exec tinycld-pkg test:e2e
      # Capture Playwright's per-failure artifacts (trace, screenshot,
      # video, error-context.md) so a CI failure can be diagnosed
      # without a re-run. `if: failure()` skips the upload on green
      # runs to save bandwidth + retention.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            ws/${{ env.PACKAGE }}/test-results/
            ws/${{ env.PACKAGE }}/playwright-report/
          retention-days: 14
